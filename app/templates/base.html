<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_title }}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/vendor/htmx.min.js"></script>
</head>
<body>
  <nav>
    <span class="brand">{{ app_title }}</span>
    <a href="/">Monitor</a>
    <a href="/network">Network</a>
    <a href="/routing">Routing</a>
    <a href="/wireguard">WireGuard</a>
    <span class="spacer"></span>
    {% if user %}<span class="user">{{ user.name or user.email or user.sub }}</span>
    <a href="/auth/logout">Log out</a>{% endif %}
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    {{ app_title }} v{{ app_version }} &middot; built by Mukesh Kesharwani
  </footer>
</body>
</html>
